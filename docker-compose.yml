version: "3.9"

services:
  postgres-postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cadastra
      POSTGRES_PASSWORD: cadastra_dev_password
      POSTGRES_DB: land_registry
    ports:
      - "5432:5432"
    volumes:
      - ./infra/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastra -d land_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9002:9001"

  besu-node:
    image: hyperledger/besu:latest
    command:
      - --genesis-file=/config/qbftConfigFile.json
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT
      - --host-allowlist=*
    volumes:
      - ./infra/besu/qbftConfigFile.json:/config/qbftConfigFile.json
    ports:
      - "8545:8545"
      - "8546:8546"
